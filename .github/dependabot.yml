version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-bun-env
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
